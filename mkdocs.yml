### Site Settings ###
#theme : readthedocs --- Optional to use if we don't like to use material theme
theme: 
  name: material
  custom_dir: docs/overrides
  icon:
    annotation: material/arrow-right-circle-outline
    logo: material/bullseye-arrow
    menu: material/bullseye-arrow
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.annotation
    - content.code.copy
    - navigation.tracking
    - navigation.path
    - navigation.tabs.sticky
    - navigation.footer
    - tabs: true
    ### If page want to be divided to 3 parts then uncomment toc.follow, either using toc.integrate
    # - toc.integrate 
    - toc.follow 
  language: en
  palette:
  # Palette toggle for light mode
    - scheme: default
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
      primary: teal
      accent: indigo
  # Palette toggle for dark mode    
    - scheme: slate
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode
      primary: black
      accent: deep orange
  font: 
    text: Roboto
    code: Roboto Mono

extra_css:
  - stylesheets/home.css
  - stylesheets/extra.css
extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  - https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js
  # - https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js
  # - javascripts/mermaid-init.js
  # - javascripts/chart-init.js

extra:
  social:
  - icon: fontawesome/brands/github-alt
    link: https://github.com/fahmi-wiradika
  - icon: material/test-tube
    link: https://testautomationu.applitools.com/me.html#fahmi-wiradika
  - icon: fontawesome/brands/linkedin
    link: https://www.linkedin.com/in/fahmi-wiradika
  - icon: fontawesome/brands/instagram
    link: https://www.instagram.com/fahmiwazu

